services:
  wall:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      SETUP_KEY: ${SETUP_KEY:?Set SETUP_KEY in .env (at least 24 characters)}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-1024}
      ORGANIZATION_PRESET: ${ORGANIZATION_PRESET:-neutral}
    volumes:
      - wall_data:/app/data
    shm_size: 256mb
    stop_grace_period: 90s
    init: false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      wall:
        condition: service_healthy
volumes:
  wall_data:
  caddy_data:
  caddy_config:

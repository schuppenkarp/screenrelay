services:
  wall:
    build: .
    image: wallrelay:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      SETUP_KEY: ${SETUP_KEY:?SETUP_KEY in .env setzen (mindestens 24 Zeichen)}
      ORGANIZATION_PRESET: ${ORGANIZATION_PRESET:-neutral}
      COOKIE_SECURE: 'false'
      TRUST_PROXY: 'false'
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-1024}
    volumes:
      - wall_data:/app/data
    shm_size: 256mb
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  wall_data:

# One app behind an existing HTTPS reverse proxy; no bundled proxy required.
services:
  wall:
    image: wallrelay:deploy
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-8045}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?External HTTPS address required}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
      SETUP_KEY: ${SETUP_KEY:-}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-1024}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - wall_data:/app/data
    shm_size: 256mb
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  wall_data:
